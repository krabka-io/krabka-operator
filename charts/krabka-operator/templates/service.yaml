apiVersion: v1
kind: Service
metadata:
  name: {{ include "krabka-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "krabka-operator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "krabka-operator.selectorLabels" . | nindent 4 }}
