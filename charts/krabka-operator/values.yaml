image:
  repository: ghcr.io/krabka-io/krabka-operator
  tag: "" # defaults to .Chart.AppVersion when empty
  digest: "" # wins over tag
  pullPolicy: IfNotPresent

# Default broker image used when a Kafka CR doesn't override it.
brokerImage:
  repository: ghcr.io/krabka-io/krabka-broker
  tag: "v1.0.8"
  digest: "sha256:1d0dd0d4d721e47866eda23279c37aba11324db222ba8cd7f001554c32e7745f" # v1.0.8; wins over tag
  pullPolicy: IfNotPresent

# Digest-pinned shell copied into distroless broker pods. Override with an
# internal mirror in air-gapped clusters.
shellImage: busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0

# Default images of the components that the operator runs, for a resource
# that sets no spec.image. Each value is a whole image reference. An empty
# value keeps the default that is built into the operator. That default names
# the repository that publishes the component image and a component release
# tag, which is not the operator version. Set a value to use a mirror or
# another release.
gatewayImage: ""
connectorImage: ""
schemaRegistryImage: "ghcr.io/krabka-io/krabka-schema-registry@sha256:b1c6021b702cd17dcae9adad7877ac31d97ddc77cb37b37df1bb698fc1ddc92b"

# Default images for operator-managed Gres compute and activator workloads.
gresImage:
  repository: ghcr.io/krabka-io/krabka-operator-gres
  tag: ""
  pullPolicy: IfNotPresent

gresActivatorImage:
  repository: ghcr.io/krabka-io/krabka-operator-gres-activator
  tag: ""
  pullPolicy: IfNotPresent

pgdogImage:
  repository: ghcr.io/pgdogdev/pgdog
  tag: "0.1.53"
  pullPolicy: IfNotPresent

# Optional durable store shared by Gres computes and the operator's final
# manifest verifier. The access keys should be supplied through a values Secret
# mechanism in production; literal values are intended only for disposable e2e.
gresCheckpoint:
  store: ""
  bucket: ""
  region: ""
  endpoint: ""
  allowHttp: false
  accessKeyId: ""
  secretAccessKey: ""

replicaCount: 1

watchNamespaces: [] # empty = cluster-scoped

# Resources for the operator pod (not the brokers it manages).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

serviceAccount:
  create: true
  name: "" # default: chart fullname

rbac:
  create: true

service:
  type: ClusterIP
  port: 8080

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

logFilter: "info,kube=warn"

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# A seccomp profile for the broker pods that allows io_uring. The broker sends
# the O_DIRECT writes of preallocate=true segments through io_uring. The
# RuntimeDefault profiles of containerd 2.x and CRI-O refuse io_uring, and the
# broker then uses its write threads. files/krabka-io-uring.json is
# containerd v2.4.2's RuntimeDefault profile, for a container with no
# capabilities, plus io_uring_setup, io_uring_enter and io_uring_register.
#
# This value only installs the profile on the nodes. The operator gives its
# broker pods RuntimeDefault, and it has no setting yet that selects another
# profile. The chart README tells the plan.
brokerSeccompProfile:
  securityProfilesOperator:
    # Create a cluster-scoped SeccompProfile of the Security Profiles Operator
    # (v1.0.0 or later, API security-profiles-operator.x-k8s.io/v1). That
    # operator writes the file to operator/<name>.json under the kubelet
    # seccomp directory of each node. Install that operator and its CRDs first.
    enabled: false
    name: krabka-io-uring

caRenewal:
  enabled: true
  schedule: "0 2 * * *"
  startingDeadlineSeconds: 600
  logFilter: "info,kube_client::client::builder=warn"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
