apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkarebalances.krabka.io
spec:
  group: krabka.io
  names:
    kind: KafkaRebalance
    plural: kafkarebalances
    shortNames:
    - kr
    singular: kafkarebalance
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for KafkaRebalanceSpec via `CustomResource`
        properties:
          spec:
            properties:
              authorizationSecretRef:
                description: "Bearer credential for `removeBrokers`, read from a Secret in this\nresource's namespace. When omitted, the operator derives\n`<cluster>-rebalancer-auth` / `token` from the `krabka.io/cluster`\nlabel. The token is never written to status."
                nullable: true
                properties:
                  key:
                    description: Key within the Secret's `data` map.
                    type: string
                  name:
                    description: Kubernetes Secret name.
                    type: string
                required:
                - key
                - name
                type: object
              brokers:
                description: Broker ids targeted by `removeBrokers` or `addBrokers`.
                items:
                  format: int32
                  type: integer
                type: array
              endpoint:
                description: "Connect-RPC base URL of the `krabka-rebalancer` service, for\nexample `http://my-cluster-rebalancer.kafka.svc:9300`. When this\nfield is absent, the operator derives\n`http://<cluster>-rebalancer.<namespace>.svc.cluster.local:9300`\nfrom the `krabka.io/cluster` label."
                nullable: true
                type: string
              goals:
                description: "Optimization goals to apply, by name, for example `RackAware` and\n`ReplicaDistribution`. When this field is absent or empty, the\nrebalancer uses its full default goal registry in priority\norder."
                items:
                  type: string
                nullable: true
                type: array
              mode:
                default: full
                description: "Proposal scope. The operator always sends this explicitly to the\nrebalancer, including the default `full` mode."
                enum:
                - full
                - removeBrokers
                - addBrokers
                type: string
              throttleBytesPerSec:
                description: "Replication throttle in bytes per second while the proposal\nexecutes. This is KIP-73. When this field is absent, the rebalancer\nuses its own `--default-throttle-bytes-per-sec`."
                format: int64
                minimum: 1.0
                nullable: true
                type: integer
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: "Kubernetes-style condition list. The `type` of the active\ncondition holds the rebalance state. It is one of\n`PendingProposal`, `ProposalReady`, `Rebalancing`, `Ready`,\n`NotReady`, and `Stopped`."
                items:
                  properties:
                    lastTransitionTime:
                      description: RFC3339 timestamp.
                      type: string
                    message:
                      description: Human-readable message.
                      type: string
                    reason:
                      description: CamelCase machine reason.
                      type: string
                    status:
                      description: "`True`, `False`, or `Unknown`."
                      type: string
                    type:
                      description: For example, `Ready`.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: "`metadata.generation` of the last spec that gave the current\nproposal. The operator advances it when it computes a new\nproposal."
                format: int64
                nullable: true
                type: integer
              optimizationResult:
                description: Summary of the proposal that the operator computed last.
                nullable: true
                properties:
                  goals:
                    description: The goals that the rebalancer applied after the selection.
                    items:
                      type: string
                    type: array
                  leaderMovements:
                    default: 0
                    description: Number of leadership changes in the proposal.
                    format: int32
                    type: integer
                  maxLeadersAfter:
                    default: 0
                    description: Max partitions led by any one broker after the proposal applies.
                    format: int32
                    type: integer
                  maxLeadersBefore:
                    default: 0
                    description: Max partitions led by any one broker before the proposal applies.
                    format: int32
                    type: integer
                  maxReplicasAfter:
                    default: 0
                    description: Max replicas on any one broker after the proposal applies.
                    format: int32
                    type: integer
                  maxReplicasBefore:
                    default: 0
                    description: Max replicas on any one broker before the proposal applies.
                    format: int32
                    type: integer
                  replicaMovements:
                    default: 0
                    description: Number of partition replica reassignments in the proposal.
                    format: int32
                    type: integer
                type: object
              sessionId:
                description: "Proposal id that the rebalancer assigned. The operator stores it,\nso that the `approve`, `stop`, and poll operations reach the same\nproposal in every reconcile."
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: KafkaRebalance
        type: object
    served: true
    storage: true
    subresources:
      status: {}
