apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkausers.krabka.io
spec:
  group: krabka.io
  names:
    kind: KafkaUser
    plural: kafkausers
    shortNames:
    - ku
    singular: kafkauser
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for KafkaUserSpec via `CustomResource`
        properties:
          spec:
            properties:
              authentication:
                description: "Tagged enum on `type`, in the same shape as Strimzi.\n\nThe wire shape is flat and Strimzi-compatible. `type` is the discriminator,\nand the per-variant config fields are siblings of `type`. The custom\n`schema_with` writes a structural schema by hand, because the\n`StructuralSchemaRewriter` of kube-rs 3.x panics when `oneOf` branches\nshare a `type` property with different `enum` values. That is the default\nschemars output for tagged-union enums. This is the same workaround as\n`Storage` in `kafka_node_pool.rs`.\n\nThe operator enforces the cross-variant constraints at reconcile time, and\nthe apiserver does not. One such constraint is that `iterations` is valid\nonly when `type=scram-sha-512`."
                properties:
                  iterations:
                    maximum: 1000000.0
                    minimum: 4096.0
                    type: integer
                  maxLifetime:
                    type: string
                  passwordLength:
                    maximum: 256.0
                    minimum: 16.0
                    type: integer
                  renewBeforeExpiry:
                    type: string
                  renewalDays:
                    maximum: 3650.0
                    minimum: 1.0
                    type: integer
                  renewers:
                    items:
                      pattern: ^User:.+$
                      type: string
                    type: array
                  type:
                    enum:
                    - scram-sha-512
                    - scram-sha-256
                    - tls
                    - tls-external
                    - delegation-token
                    type: string
                  validityDays:
                    maximum: 36500.0
                    minimum: 1.0
                    type: integer
                required:
                - type
                type: object
              authorization:
                description: "Authorization is optional. A user with no ACLs can still\nauthenticate. When this field is absent, the operator skips ACL\nreconciliation."
                nullable: true
                oneOf:
                - required:
                  - type
                properties:
                  acls:
                    default: []
                    items:
                      description: "One rule from `spec.authorization.acls`. The operator expands it into one\n`(resource, operation, host, type)` tuple per `operations` entry at\nreconcile time."
                      properties:
                        host:
                          description: "Source-address pattern. `\"*\"` is the wildcard. Defaults to `\"*\"` when\nomitted."
                          type: string
                        operations:
                          description: "Non-empty list. The reconciler refuses an empty `operations` with\n`Ready=False reason=InvalidSpec`."
                          items:
                            description: "All 11 Kafka ACL operations. Matches the discriminants in\n`org.apache.kafka.common.acl.AclOperation`."
                            enum:
                            - All
                            - Read
                            - Write
                            - Create
                            - Delete
                            - Alter
                            - Describe
                            - ClusterAction
                            - DescribeConfigs
                            - AlterConfigs
                            - IdempotentWrite
                            type: string
                          type: array
                        resource:
                          properties:
                            name:
                              type: string
                            patternType:
                              default: literal
                              description: "`literal` for an exact match, or `prefixed` for resources whose name\nstarts with `name`. Defaults to `literal`."
                              enum:
                              - literal
                              - prefixed
                              type: string
                            type:
                              enum:
                              - topic
                              - group
                              - cluster
                              - transactional-id
                              type: string
                          required:
                          - name
                          - type
                          type: object
                        type:
                          default: allow
                          description: "`allow` or `deny`; defaults to `allow`."
                          enum:
                          - allow
                          - deny
                          type: string
                      required:
                      - operations
                      - resource
                      type: object
                    type: array
                  type:
                    enum:
                    - simple
                    type: string
                type: object
              quotas:
                description: "Optional per-user client quotas (KIP-13/124/257). This field maps\nonto Kafka's `(user)` quota entity through `AlterClientQuotas`, which\nis `api_key` 49. When the field is absent, the operator does not touch\nthe broker's quota state. When the field is present, the operator\ndrives the broker's quota keys for `User:<name>` toward the spec. It\nsets the configured fields and tombstones the omitted ones."
                nullable: true
                properties:
                  consumerByteRate:
                    description: Maximum consume-side bytes/sec. Backed by `consumer_byte_rate`.
                    format: int32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  controllerMutationRate:
                    description: "KIP-599 controller-mutation rate in creates and deletes per second.\nBacked by `controller_mutation_rate`."
                    format: double
                    nullable: true
                    type: number
                  producerByteRate:
                    description: Maximum produce-side bytes/sec. Backed by `producer_byte_rate`.
                    format: int32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  requestPercentage:
                    description: "Maximum percentage of a request-handler thread's time that the user\ncan consume, in the range `0..=100`. Backed by `request_percentage`."
                    format: int32
                    maximum: 100.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                type: object
            required:
            - authentication
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: Standard Kubernetes-style condition list. It shows `Ready`.
                items:
                  properties:
                    lastTransitionTime:
                      description: RFC3339 timestamp.
                      type: string
                    message:
                      description: Human-readable message.
                      type: string
                    reason:
                      description: CamelCase machine reason.
                      type: string
                    status:
                      description: "`True`, `False`, or `Unknown`."
                      type: string
                    type:
                      description: For example, `Ready`.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              delegationTokenExpiryTimestampMs:
                description: "Current `expiry_timestamp_ms` of the operator-managed delegation\ntoken. Each successful renew extends it. The operator compares it\nagainst `now` to decide when to renew, as\n`spec.authentication.renewBeforeExpiry` specifies."
                format: int64
                nullable: true
                type: integer
              delegationTokenId:
                description: "Persisted `token_id`, a UUID, of the operator-managed delegation\ntoken for this user. The operator uses it across reconciles to find the\nsame token with `DescribeDelegationToken`. It is present once the\noperator has issued a token with `CreateDelegationToken`."
                nullable: true
                type: string
              delegationTokenMaxTimestampMs:
                description: "Token's absolute upper bound, which is `max_timestamp_ms`. A renew can\nnever push `expiry_timestamp_ms` past this bound. The operator stops\nthe renews and surfaces `TokenExpiring` once no more extension is\npossible."
                format: int64
                nullable: true
                type: integer
              external:
                default: false
                description: "`true` once the operator has reconciled a credential-less user with\n`type: tls-external`. It appears in `kubectl describe ku`, so that\noperators can see that the operator does not own this user's\ncredentials."
                type: boolean
              observedGeneration:
                description: "`metadata.generation` of the last successfully-reconciled spec."
                format: int64
                nullable: true
                type: integer
              quotasInSync:
                default: false
                description: "True once the operator has reflected the spec's `quotas`, if any, in\nthe broker's `(user)` client-quota state. False when `spec.quotas` is\n`None`, because the operator then does not touch broker quotas."
                type: boolean
              scramSha256:
                default: false
                description: True once SCRAM-SHA-256 credentials are provisioned.
                type: boolean
              scramSha512:
                default: false
                description: True once SCRAM-SHA-512 credentials are provisioned.
                type: boolean
              secret:
                description: Name of the Kubernetes Secret holding the user's password.
                nullable: true
                type: string
              tls:
                default: false
                description: "`true` once a TLS user has a current cert Secret. It has the same\nshape as `scram_sha512`."
                type: boolean
              tlsCertNotAfter:
                description: "RFC3339 timestamp of the user cert's `notAfter`. Present when\n`tls == true`."
                nullable: true
                type: string
              tlsPrincipal:
                description: "The principal string that the operator pinned in ACLs. It is\n`User:CN=alice` for TLS users, and `User:alice` for SCRAM and\n`tls-external` users. It is always filled in when the user is\nprovisioned. It is load-bearing for the debug of ACL-match problems."
                nullable: true
                type: string
              username:
                description: Effective Kafka principal name. It matches `metadata.name`.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: KafkaUser
        type: object
    served: true
    storage: true
    subresources:
      status: {}
