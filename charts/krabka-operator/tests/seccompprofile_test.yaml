# The chart can install the broker seccomp profile through the Security
# Profiles Operator. The SeccompProfile is off by default, and when it is on,
# its spec is files/krabka-io-uring.json.
suite: broker seccomp profile
templates:
  - seccompprofile.yaml
release:
  name: demo
  namespace: krabka-system
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a cluster-scoped SeccompProfile when it is enabled
    set:
      brokerSeccompProfile.securityProfilesOperator.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: SeccompProfile
      - isAPIVersion:
          of: security-profiles-operator.x-k8s.io/v1
      - equal:
          path: metadata.name
          value: krabka-io-uring
      - notExists:
          path: metadata.namespace
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: broker-seccomp-profile
      - equal:
          path: spec.defaultAction
          value: SCMP_ACT_ERRNO
      - contains:
          path: spec.syscalls
          content:
            names:
              - io_uring_enter
              - io_uring_register
              - io_uring_setup
            action: SCMP_ACT_ALLOW
      - contains:
          path: spec.syscalls
          content:
            names:
              - clone3
            action: SCMP_ACT_ERRNO
            errnoRet: 38

  - it: takes the SeccompProfile name from the values
    set:
      brokerSeccompProfile.securityProfilesOperator.enabled: true
      brokerSeccompProfile.securityProfilesOperator.name: brokers-io-uring
    asserts:
      - equal:
          path: metadata.name
          value: brokers-io-uring
