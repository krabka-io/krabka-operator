[workspace]
resolver = "2"
members = ["crates/*"]
# The cargo-mutants pin that Bazel builds //tools/mutants from is not a member.
exclude = ["tools/mutants"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["The Krabka Authors"]
rust-version = "1.98.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# These three opt-outs are intentional while the public API is still pre-1.0;
# re-evaluate once API surfaces stabilise.
clone_on_copy = "warn"

[profile.mutants]
inherits = "test"
debug = "none"

[profile.dev]
# Split debug info into a separate file (reduces linker work)
split-debuginfo = "packed"

[workspace.dependencies]
anyhow = "1"
# Expressive test assertions: `assert!(a == b)` / `check!(..)` with
# captured-expression diagnostics. Used for all test assertions workspace-wide.
assert2 = "0.4"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive"] }
# Derive boilerplate for domain newtypes (Display/From/Into/Deref/AsRef/
# Constructor/FromStr and numeric ops) so wrappers over wire/domain primitives
# stay one-liners. See docs/style_guides/code_style_guide.md#newtypes-for-domain-values.
derive_more = { version = "2", features = ["display", "from", "into", "deref", "as_ref", "constructor", "from_str", "add", "add_assign", "mul", "sum"] }
futures = "0.3"
hex = "0.4"
jsonpath-rust = "1.0"
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_32"] }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
# mutants: `#[cfg_attr(test, mutants::skip)]` attribute for cargo-mutants. Used
# only where `exclude_re` cannot reliably suppress a mutant (struct-field-deletion
# mutants on a live-IO adapter). Dev-dependency only; expands to nothing.
mutants = "0.0.4"
native-tls = "0.2"
# `object_store` is the Apache-stewarded multi-backend object-store client used
# across the Rust data ecosystem (DataFusion, Polars, Delta-rs). Krabka's
# S3-compatible and native-GCS RemoteStorageManagers (KIP-405) are built on it.
#
# Kept on the same minor as `krabka-object-store` in krabka-broker, so the
# graph carries one copy of the crate.
object_store = { version = "0.14", features = ["aws", "gcp"] }
postgres-native-tls = "0.5.3"
prometheus-client = "0.25"
refined_type = "0.6"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# strum: derive enum<->&'static str (IntoStaticStr) and &str->enum (EnumString)
# to retire hand-written match-arm conversions. Its whole proc-macro tree
# (syn/quote/proc-macro2/heck/rustversion) is already compiled in the graph,
# so the marginal build cost is one small proc-macro crate.
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-postgres = "0.7"
toml = "1.1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.18"

# First-party crates inherited by more than one member.
krabka-security = "0.6.0"
krabka-units = "0.6.0"

# Sibling repositories, pinned by revision. These crates are declared
# against crates.io above and in the member manifests; the patch below is
# the single place a sibling revision is bumped.
#
# Every crate each sibling publishes is listed, not only the ones this
# repo names directly: cargo ignores a dependency's own patch table, so a
# crate reached transitively would otherwise come from the registry while
# its git twin is also in the graph.
[patch.crates-io]
# Resolved from krabka-schema-registry rather than krabka-streams-rs: the two
# repos ship diverged copies of this crate, and `krabka-broker`'s schema
# validation needs the registry's API (`format::validate`,
# `RegistryClient::subject_versions_for_id`, `FetchedSchema::kind`).
krabka-admin-ui = { git = "https://github.com/krabka-io/krabka-cli", rev = "e94261918532e9f4ebcd089f9906df1ea7bb116d" }
krabka-app-sdk = { git = "https://github.com/krabka-io/krabka-gateway", rev = "44db5987093d62c1563bdba0358a481059d885bc" }
