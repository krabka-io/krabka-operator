crabka-kraft-core = { git = "https://github.com/krabka-io/krabka-broker", rev = "a53aa0a4630ba58927e50a4721a6c894d3786478" }
crabka-log = { git = "https://github.com/krabka-io/krabka-broker", rev = "a53aa0a4630ba58927e50a4721a6c894d3786478" }
crabka-logfmt = { git = "https://github.com/krabka-io/krabka-broker", rev = "a53aa0a4630ba58927e50a4721a6c894d3786478" }
crabka-object-store = { git = "https://github.com/krabka-io/krabka-broker", rev = "a53aa0a4630ba58927e50a4721a6c894d3786478" }
crabka-raft = { git = "https://github.com/krabka-io/krabka-broker", rev = "a53aa0a4630ba58927e50a4721a6c894d3786478" }
crabka-records-legacy = { git = "https://github.com/krabka-io/krabka-broker", rev = "a53aa0a4630ba58927e50a4721a6c894d3786478" }
crabka-remote-storage = { git = "https://github.com/krabka-io/krabka-broker", rev = "a53aa0a4630ba58927e50a4721a6c894d3786478" }
crabka-remote-storage-topic = { git = "https://github.com/krabka-io/krabka-broker", rev = "a53aa0a4630ba58927e50a4721a6c894d3786478" }
crabka-telemetry = { git = "https://github.com/krabka-io/krabka-broker", rev = "a53aa0a4630ba58927e50a4721a6c894d3786478" }
crabka-throttle = { git = "https://github.com/krabka-io/krabka-broker", rev = "a53aa0a4630ba58927e50a4721a6c894d3786478" }
crabka-verified = { git = "https://github.com/krabka-io/krabka-broker", rev = "a53aa0a4630ba58927e50a4721a6c894d3786478" }
crabka-client-admin = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "dbea46923441c19b7858d7e3278ca5b77af2e00b" }
crabka-client-consumer = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "dbea46923441c19b7858d7e3278ca5b77af2e00b" }
crabka-client-core = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "dbea46923441c19b7858d7e3278ca5b77af2e00b" }
crabka-client-producer = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "dbea46923441c19b7858d7e3278ca5b77af2e00b" }
