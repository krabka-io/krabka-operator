crabka-ids = { git = "https://github.com/krabka-io/krabka-protocol", rev = "1e164af6f10275f14696418e61d60d5930788c1a" }
crabka-kafka-tap = { git = "https://github.com/krabka-io/krabka-protocol", rev = "1e164af6f10275f14696418e61d60d5930788c1a" }
crabka-metadata = { git = "https://github.com/krabka-io/krabka-protocol", rev = "1e164af6f10275f14696418e61d60d5930788c1a" }
crabka-protocol = { git = "https://github.com/krabka-io/krabka-protocol", rev = "1e164af6f10275f14696418e61d60d5930788c1a" }
crabka-security = { git = "https://github.com/krabka-io/krabka-protocol", rev = "1e164af6f10275f14696418e61d60d5930788c1a" }
