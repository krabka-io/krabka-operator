# apko image definition for the operator.
#
# It complements packaging/Dockerfile rather than replacing it. The Dockerfile
# builds from source with cargo and is what CI builds and publishes today. This
# definition assembles a Wolfi image from a prebuilt `krabka-operator` APK.
#
# That APK is not buildable yet. It was a subpackage of the melange recipe
# packaging/melange/crabka.yaml, which built ten binaries from one workspace
# `cargo build`. The recipe now lives in krabka-io/tooling as a reference, and
# no repository holds that crate set, so the `krabka-operator` package below is
# a dangling dependency until a melange recipe for this repository produces it.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - tzdata
    - wolfi-baselayout
    - glibc
    - ld-linux
    - krabka-operator

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/krabka-operator

cmd: run

archs:
  - x86_64
  - aarch64
